<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Director's Chair Favicon - bolder strokes & filled canvas for crystal clear small scale -->
  <g>
    <!-- Backrest uprights -->
    <line x1="8" y1="4" x2="8" y2="24" stroke="#8c7355" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="40" y1="4" x2="40" y2="24" stroke="#8c7355" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Finials -->
    <circle cx="8" cy="4" r="3" fill="#755f44"/>
    <circle cx="40" cy="4" r="3" fill="#755f44"/>

    <!-- Backrest Fabric Canvas -->
    <rect x="9.5" y="7" width="29" height="13" rx="2" fill="#1f1d1a"/>

    <!-- Armrests -->
    <line x1="4" y1="20" x2="14" y2="20" stroke="#755f44" stroke-width="4" stroke-linecap="round"/>
    <line x1="34" y1="20" x2="44" y2="20" stroke="#755f44" stroke-width="4" stroke-linecap="round"/>

    <!-- Seat Fabric -->
    <polygon points="7,23 41,23 37,28 11,28" fill="#1f1d1a"/>
    <line x1="7" y1="23.5" x2="41" y2="23.5" stroke="#8c7355" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Cross scissor legs -->
    <line x1="11" y1="26" x2="37" y2="45" stroke="#8c7355" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="37" y1="26" x2="11" y2="45" stroke="#8c7355" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Center Pivot Rivet -->
    <circle cx="24" cy="35.5" r="3.2" fill="#1f1d1a" stroke="#d5be9b" stroke-width="1.8"/>

    <!-- Footrest Bar -->
    <line x1="15" y1="41" x2="33" y2="41" stroke="#755f44" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
